<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ElonaPlus 2.33R — Web 重制版</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/charcreate.css" />
</head>
<body>
  <!-- 主菜单（title.bmp + interface.bmp 窗口） -->
  <div id="menu" class="screen active">
    <div class="stage">
      <canvas id="title-canvas" width="800" height="600"></canvas>
      <!-- 启动预加载进度（main.js 的 boot() 在读完数据后移除） -->
      <div id="boot-loading">载入数据…</div>
    </div>
  </div>

  <!-- 角色创建（8 步向导；#cc-legacy 是给既有回归脚本用的隐藏状态镜像） -->
  <div id="create" class="screen cc-active">
    <div id="cc-root" class="cc-stage"></div>
    <div id="cc-legacy" class="cc-legacy">
      <label>角色名 <input id="pc-name" type="text" value="Elona" maxlength="12" /></label>
      <label>性别
        <select id="pc-gender">
          <option value="0">Female</option>
          <option value="1">Male</option>
        </select>
      </label>
      <label>种族 <select id="pc-race"></select></label>
      <label>职业 <select id="pc-class"></select></label>
      <label>专长技能 <select id="pc-skill"></select></label>
      <span id="pc-feat-points">3</span>
      <div id="pc-feats" class="pc-feats"></div>
      <div id="pc-profile" class="pc-profile"></div>
      <div id="pc-attrs" class="pc-attrs"></div>
      <canvas id="pc-preview" width="128" height="192"></canvas>
      <div id="pc-info" class="pc-info"></div>
      <button id="btn-clear-feats" type="button">清空</button>
      <button id="btn-reroll-profile" type="button">Reroll</button>
      <button id="btn-reroll-attrs" type="button">Reroll</button>
      <button id="btn-reroll-look" type="button">随机外观</button>
      <button id="btn-create-ok">开始冒险</button>
      <button id="btn-create-back">返回</button>
    </div>
  </div>

  <!-- 游戏画面 -->
  <div id="game" class="screen">
    <div class="stage">
      <canvas id="screen" width="800" height="600"></canvas>
      <div id="loading" class="hidden">载入中…</div>
      <!-- 商店 -->
      <div id="shop" class="panel hidden">
        <div class="panel-head">
          <span id="shop-title">商店</span>
          <span class="panel-hint">↑↓ 选择　←→ 翻页　Enter 交易　Tab 切换　T 关闭</span>
        </div>
        <div class="shop-tabs">
          <button id="shop-tab-buy" class="on">购买</button>
          <button id="shop-tab-sell">出售</button>
        </div>
        <div id="shop-money"></div>
        <div id="shop-list"></div>
        <div id="shop-page"><span id="shop-page-text"></span><span class="shop-page-nav">← → 翻页</span></div>
        <div id="shop-detail">选择一件物品。</div>
        <div id="shop-actions">
          <button id="shop-buy1">买 1 个</button>
          <button id="shop-buy5">买 5 个</button>
          <button id="shop-sell1">卖 1 个</button>
          <button id="shop-sell5">卖 5 个</button>
          <button id="shop-invest1">投资</button>
          <button id="shop-invest50">投资 50</button>
          <button id="shop-steal">偷窃</button>
        </div>
      </div>
      <!-- NPC 交互 -->
      <div id="npc" class="panel hidden">
        <div class="panel-head">
          <span id="npc-title">NPC</span>
          <span class="panel-hint">Esc 关闭</span>
        </div>
        <div id="npc-text" class="npc-text"></div>
        <div id="npc-actions" class="npc-actions"></div>
        <div id="npc-feelings" class="npc-train hidden">
          <select id="npc-feeling"></select>
          <button id="npc-feeling-ok">说</button>
        </div>
        <div id="npc-train" class="npc-train hidden">
          <select id="npc-skill"></select>
          <button id="npc-train-ok">训练</button>
        </div>
        <div id="npc-give" class="npc-give hidden"></div>
      </div>
      <!-- 掲示板 / 委托 -->
      <div id="quest" class="panel hidden">
        <div class="panel-head">
          <span>掲示板 — 委托</span>
          <span class="panel-hint">Esc 关闭</span>
        </div>
        <div id="quest-active" class="quest-active"></div>
        <div class="quest-page">
          <button id="quest-prev">◀</button>
          <span id="quest-page-info">Page 1/1</span>
          <button id="quest-next">▶</button>
          <span class="quest-hint">←/→ 翻页</span>
        </div>
        <div id="quest-list" class="quest-list"></div>
      </div>
      <!-- 世界地图 -->
      <div id="worldmap" class="panel hidden">
        <div class="panel-head">
          <span>世界地图</span>
          <span class="panel-hint">M 关闭</span>
        </div>
        <div class="wm-info" id="wm-info"></div>
        <img id="wm-img" src="assets/graphic/world.bmp" alt="world map" />
        <div class="wm-dest" id="wm-dest"></div>
      </div>
      <!-- 世界地图步行模式的调试直达栏 -->
      <div id="wm-walk" class="wm-walk hidden">
        <span class="wm-walk-title">世界地图（方向键移动 / M 返回）</span>
        <div id="wm-walk-dest" class="wm-dest"></div>
      </div>
    </div>
  </div>
